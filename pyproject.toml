[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localia"
version = "0.3.1"
description = "LocalIA decision harness — Jev Core with LM Studio structured semantic router"
requires-python = ">=3.11"
dependencies = [
    "lmstudio==1.5.0",
]

[project.scripts]
localia = "localia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
