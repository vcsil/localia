[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localia"
version = "0.5.2"
description = "LocalIA decision harness — Jev routing evaluation suite"
requires-python = ">=3.11"
dependencies = [
    "lmstudio==1.5.0",
]

[project.scripts]
localia = "localia.cli:main"
localia-routing-eval = "localia.evals.routing:main"

[tool.setuptools.packages.find]
where = ["src"]
